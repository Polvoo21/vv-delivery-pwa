name: vv-delivery-pwa

services:
  db:
    image: postgres:16-alpine
    container_name: vv-delivery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vv_delivery}
      POSTGRES_USER: ${POSTGRES_USER:-vv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vv} -d ${POSTGRES_DB:-vv_delivery}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  app:
    container_name: vv-delivery-app
    build:
      context: .
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-vv}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vv_delivery}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - internal
      - edge

networks:
  internal:
  edge:
    external: true

volumes:
  pgdata:
